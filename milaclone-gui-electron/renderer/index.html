<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' milafile: data:; media-src milafile:">
  <title>Milaclone</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <aside id="rail">
    <button class="rl" data-tool="note"><svg viewBox="0 0 18 18"><rect x="2" y="3" width="14" height="12" rx="2.5" fill="none" stroke="currentColor" stroke-width="1.5"/><path d="M5.5 7h7M5.5 10h5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg><span>Note</span></button>
    <button class="rl" data-tool="heading"><svg viewBox="0 0 18 18"><path d="M3 4.5v9M8 4.5v9M3 9h5M11 4.5h4M11 9h4M11 13.5h4" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg><span>Heading</span></button>
    <button class="rl" data-tool="link"><svg viewBox="0 0 18 18"><path d="M7.5 10.5l3-3M6 12l-1.8 1.8a2.4 2.4 0 0 0 3.4 3.4L9.4 15.4M12 6l1.8-1.8a2.4 2.4 0 0 0-3.4-3.4L8.6 2.6" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" transform="translate(0 1)"/></svg><span>Link</span></button>
    <button class="rl" data-tool="todo"><svg viewBox="0 0 18 18"><path d="M2.5 4.5h13M2.5 9h13M2.5 13.5h13" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/><circle cx="4.5" cy="4.5" r="1.1" fill="currentColor"/><circle cx="4.5" cy="9" r="1.1" fill="currentColor"/><circle cx="4.5" cy="13.5" r="1.1" fill="currentColor"/></svg><span>To-do</span></button>
    <button class="rl" data-tool="board"><svg viewBox="0 0 18 18"><rect x="2" y="2.5" width="5.5" height="13" rx="1.5" fill="none" stroke="currentColor" stroke-width="1.5"/><rect x="10.5" y="2.5" width="5.5" height="8" rx="1.5" fill="none" stroke="currentColor" stroke-width="1.5"/></svg><span>Board</span></button>
    <button class="rl" data-tool="column"><svg viewBox="0 0 18 18"><rect x="2.5" y="2.5" width="13" height="13" rx="2" fill="none" stroke="currentColor" stroke-width="1.5"/><path d="M2.5 6.5h13" stroke="currentColor" stroke-width="1.5"/></svg><span>Column</span></button>
    <button class="rl" data-tool="comment"><svg viewBox="0 0 18 18"><path d="M2.5 4.5A2 2 0 0 1 4.5 2.5h9a2 2 0 0 1 2 2v6a2 2 0 0 1-2 2H8l-3.5 3v-3h-.5a2 2 0 0 1-2-2z" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/></svg><span>Comment</span></button>
    <button class="rl" data-tool="line"><svg viewBox="0 0 18 18"><path d="M3 14L14 4" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/><path d="M14 4l-.4 3.4M14 4l-3.4.4" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg><span>Line</span></button>
    <button class="rl" data-tool="table"><svg viewBox="0 0 18 18"><rect x="2.5" y="2.5" width="13" height="13" rx="2" fill="none" stroke="currentColor" stroke-width="1.5"/><path d="M2.5 7h13M2.5 11.5h13M7.5 2.5v13M12.5 2.5v13" stroke="currentColor" stroke-width="1.2"/></svg><span>Table</span></button>
    <button class="rl" data-tool="document"><svg viewBox="0 0 18 18"><path d="M4 2.5h6.5L14.5 6v9.5a1 1 0 0 1-1 1h-9a1 1 0 0 1-1-1v-12a1 1 0 0 1 1-1z" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/><path d="M10.5 2.5V6H14" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/></svg><span>Document</span></button>
    <button class="rl" data-tool="image"><svg viewBox="0 0 18 18"><rect x="2.5" y="3" width="13" height="12" rx="2" fill="none" stroke="currentColor" stroke-width="1.5"/><circle cx="6.5" cy="7" r="1.4" fill="currentColor"/><path d="M3.5 13.5l4-4 3 3 2.5-2.5 2.5 2.5" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/></svg><span>Image</span></button>
    <button class="rl" data-tool="file"><svg viewBox="0 0 18 18"><path d="M4 2.5h6.5L14.5 6v9.5a1 1 0 0 1-1 1h-9a1 1 0 0 1-1-1v-12a1 1 0 0 1 1-1z" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/><path d="M7 9.5l4 2.2-4 2.2z" fill="currentColor"/></svg><span>File</span></button>
    <div class="rail-sep"></div>
    <button class="rl" id="trashBtn"><svg viewBox="0 0 18 18"><path d="M3.5 5h11M7 5V3.5h4V5M5 5l.7 9.5a1 1 0 0 0 1 .9h4.6a1 1 0 0 0 1-.9L13 5M7.5 8v4.5M10.5 8v4.5" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg><span>Trash</span></button>
    <button class="rl" id="searchBtn"><svg viewBox="0 0 18 18"><circle cx="8" cy="8" r="4.5" fill="none" stroke="currentColor" stroke-width="1.5"/><path d="M11.5 11.5L15 15" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg><span>Search</span></button>
  </aside>

  <main id="frame">
    <div id="stage">
      <div id="world"></div>
      <div id="marquee" class="hidden"></div>
      <div id="hint" class="hidden">Double-click to add a note</div>
      <div id="crumb" class="pill"></div>
      <div class="pill" id="actions">
        <button id="upBtn" title="Parent board (Alt+Up)">▲</button>
        <button id="vaultBtn" title="Switch or create a vault">Vault: My Vault</button>
        <span id="saveState"></span>
      </div>
    </div>
  </main>

  <div id="ctxmenu" class="hidden"></div>
  <div id="snackbar" class="hidden"><span id="snack-text"></span></div>

  <dialog id="searchDialog">
    <input id="searchBox" placeholder="Search boards and cards…" autocomplete="off">
    <div id="searchResults"></div>
  </dialog>

  <dialog id="trashDialog">
    <h2>Trash</h2>
    <div id="trashList"></div>
    <footer>
      <button id="trashRestore" class="primary">Restore</button>
      <button id="trashEmpty" class="danger">Empty trash</button>
      <button id="trashClose">Close</button>
    </footer>
  </dialog>

  <dialog id="vaultDialog">
    <h2>Vaults</h2>
    <div id="vaultList"></div>
    <footer>
      <input id="vaultNewName" placeholder="New vault name" autocomplete="off">
      <button id="vaultCreate" class="primary">Create</button>
      <button id="vaultRename">Rename</button>
      <button id="vaultReveal">Show folder</button>
      <button id="vaultClose">Close</button>
    </footer>
  </dialog>

  <dialog id="imageDialog" aria-label="Image viewer">
    <button class="imgbtn close" id="imgClose" aria-label="Close">×</button>
    <button class="imgbtn nav prev" id="imgPrev" aria-label="Previous image">←</button>
    <button class="imgbtn nav next" id="imgNext" aria-label="Next image">→</button>
    <img id="imgFull" alt="" />
    <div class="imgbar">
      <div class="imgcount" id="imgCount"></div>
      <div class="imgCaption" id="imgCaption"></div>
    </div>
  </dialog>

  <dialog id="docDialog">
    <header><span id="docTitle" contenteditable="true"></span><span id="docCount"></span></header>
    <div id="docBody" contenteditable="true"></div>
  </dialog>

  <dialog id="labelsDialog">
    <h2>Labels</h2>
    <input id="labelsBox" placeholder="Comma separated, e.g. plot, draft" autocomplete="off">
    <footer>
      <button id="labelsSave" class="primary">Apply</button>
      <button id="labelsClear">Clear</button>
      <button id="labelsClose">Close</button>
    </footer>
  </dialog>

  <dialog id="promptDialog">
    <h2 id="promptTitle"></h2>
    <input id="promptBox" autocomplete="off">
    <footer>
      <button id="promptCancel">Cancel</button>
      <button id="promptOk" class="primary">OK</button>
    </footer>
  </dialog>

  <script src="renderer.js"></script>
</body>
</html>
